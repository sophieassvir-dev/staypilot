# fly.toml app configuration file generated for staypilot on 2026-06-11T10:05:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'staypilot'
primary_region = 'cdg'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'staypilot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
